<style>
/* Layout: editing-desk console — sticky header with tabs, one working area per tab; A/B/C mode colours run through every timeline strip */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --sunken:#E3E6EC; --line:#D3D7DF; --ink:#14161B; --muted:#5A6072;
  --accent:#2340E0; --accent-ink:#FFFFFF;
  --mode-a:#C98A00; --mode-b:#2340E0; --mode-c:#D9482B;
  --ok:#1E8A55; --warn:#B7791F; --danger:#C2362B;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101217; --surface:#181B22; --sunken:#0C0E12; --line:#2A2F3A; --ink:#ECEEF3; --muted:#9AA1B3;
  --accent:#7D8CFF; --accent-ink:#0C0E12;
  --mode-a:#F0B429; --mode-b:#7D8CFF; --mode-c:#FF7A5C;
  --ok:#4CC38A; --warn:#E7B04B; --danger:#FF6B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#181B22; --sunken:#0C0E12; --line:#2A2F3A; --ink:#ECEEF3; --muted:#9AA1B3;
  --accent:#7D8CFF; --accent-ink:#0C0E12;
  --mode-a:#F0B429; --mode-b:#7D8CFF; --mode-c:#FF7A5C;
  --ok:#4CC38A; --warn:#E7B04B; --danger:#FF6B5E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.2px}
.brand .tc{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab.soon{cursor:default;opacity:.6}
.tab.soon:hover{background:none;color:var(--muted)}
.tab small{font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;margin-left:6px;text-transform:uppercase}

main{padding-block:24px 64px}
.status{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.status.err{color:var(--danger)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.3px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-size:16px;font-weight:600}
.card .desc{color:var(--muted);font-size:14px;margin:0}
.code{font-family:var(--mono);font-size:13px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

.media{position:relative;background:var(--sunken);aspect-ratio:9/16;max-height:420px;width:100%;display:grid;place-items:center;overflow:hidden}
.media.short{aspect-ratio:9/12}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .ph{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:16px}

/* timeline strip: modes A/B/C as proportional segments */
.strip{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunken)}
.strip.big{height:28px;border-radius:5px}
.strip span{display:block;height:100%}
.strip .a{background:var(--mode-a)} .strip .b{background:var(--mode-b)} .strip .c{background:var(--mode-c)}
.strip.big span{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;padding-left:8px;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters.sub{margin-top:-6px}
.filters.sub button{font-size:12.5px;padding:4px 10px;border-style:dashed}
.filters.sub button[aria-pressed="true"]{border-style:solid}
.grouphead{margin:22px 0 10px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.grouphead:first-child{margin-top:4px}
.media .ext{font:600 28px var(--mono);color:var(--muted);text-transform:uppercase}
.media audio{width:88%}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:24px}
.panel h3{font-family:var(--display);font-weight:500;font-size:17px;margin-bottom:4px}
.panel > p{margin:0 0 16px;color:var(--muted);font-size:14px}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
legend{font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0}
.fields{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum{font-family:var(--mono);font-size:12.5px}
.sum.bad{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--danger)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-weight:600}

.projrow{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.projrow:hover{background:var(--sunken)}
.projlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.projlist .projrow:last-child{border-bottom:0}
.projrow h3{font-size:15.5px;font-weight:600}
.projrow .sub{font-size:13px;color:var(--muted)}
@media (max-width:640px){.projrow{grid-template-columns:minmax(0,1fr) auto}.projrow .strip{display:none}}

.s-draft{color:var(--muted)} .s-story{color:var(--mode-b)} .s-images{color:var(--warn)} .s-edit{color:var(--mode-c)} .s-done{color:var(--ok)}
.swatches{display:flex;gap:4px}
.swatches i{width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}
[hidden]{display:none!important}
:root{--k-gen:#E0559B;--k-l2d:#3D63F2;--k-motion:#8B5CF6;--k-d3:#0E9F8A;--k-kinetic:#D9482B;--k-media:#C98A00}
.k-gen{background:var(--k-gen)}.k-l2d{background:var(--k-l2d)}.k-motion{background:var(--k-motion)}.k-d3{background:var(--k-d3)}.k-kinetic{background:var(--k-kinetic)}.k-media{background:var(--k-media)}
.kdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.kstrip{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 8px;align-items:center;margin-top:6px}
.kstrip .strip{height:8px}.kstrip .klegend{grid-column:2;font-size:12px;color:var(--muted)}.klab{font-size:11px;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.stepchip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none}
.stepchip .code{font-size:11px}.stepchip.ok{color:var(--ok);border-color:var(--ok)}
.step{border-top:1px solid var(--line);padding-top:16px;margin-top:18px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:90px}
.step h4{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 6px}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.wincard{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--bg)}
.wincard:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wincard:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.wincard input{position:absolute;opacity:0;pointer-events:none}
.winpic{position:relative;height:84px;border-radius:6px;background:linear-gradient(var(--sunken) 0 55%, var(--line) 55% 100%);overflow:hidden}
.winpic i{position:absolute;background:var(--muted)}
.wp-popout i{left:22%;right:22%;top:46%;bottom:-8px;border-radius:8px 8px 0 0}
.wp-popout::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--muted);left:calc(50% - 13px);top:30%}
.wp-window i{left:18%;right:18%;top:58%;bottom:-6px;border-radius:8px}
.wp-circle i{width:38px;height:38px;border-radius:50%;left:calc(50% - 19px);top:56%}
.wp-strip i{left:0;right:0;top:62%;bottom:0}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.quad{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}
.sbsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}

.refs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ref{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ref .media{border-radius:8px;border:1px solid var(--line)}
.ref figcaption{display:flex;flex-direction:column;gap:2px;min-width:0}
details > summary{list-style-position:inside}
.manual{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.quick{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;margin:12px 0 4px;display:grid;gap:10px}
.quick ol{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px;line-height:1.55}
.blkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin:6px 0 12px}
.blkgrid label{display:flex;gap:7px;align-items:center;font-size:13.5px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sbt{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sbr{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);border-left:4px solid var(--line);align-items:start}
.sbr:last-child{border-bottom:0}
.sbr.m-A{border-left-color:var(--mode-a)} .sbr.m-B{border-left-color:var(--mode-b)} .sbr.m-C{border-left-color:var(--mode-c)}
.sbtime{font-size:12.5px;line-height:1.35}
.sbtext{font-size:14.5px;min-width:0}
.sbctl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.sbctl select,.sbctl textarea{padding:6px 8px;font-size:13.5px}
.sbctl textarea{min-height:56px;resize:vertical}
@media (max-width:720px){.sbr{grid-template-columns:56px minmax(0,1fr)}.sbctl{grid-column:1/-1}}
@media (max-width:640px){.brand .tc{display:none}.bar{gap:10px}nav{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}.tab{flex:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
